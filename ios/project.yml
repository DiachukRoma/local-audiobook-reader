# XcodeGen spec: `cd ios && xcodegen` generates AudiobookReader.xcodeproj.
name: AudiobookReader
options:
  bundleIdPrefix: local.audiobookreader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
targets:
  AudiobookReader:
    type: application
    platform: iOS
    sources:
      - path: AudiobookReader
      # Supertonic 3 model (gitignored; download it with scripts/download_model.py) bundled as folders.
      - path: ../models/supertonic-3/onnx
        type: folder
        buildPhase: resources
      - path: ../models/supertonic-3/voice_styles
        type: folder
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_NAME: Audiobook Reader
        PRODUCT_BUNDLE_IDENTIFIER: local.audiobookreader.ipad
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Аудіокнижка
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        CODE_SIGN_STYLE: Automatic
    info:
      path: AudiobookReader/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
