[project]
name = "local-audiobook-reader"
version = "1.0.2"
description = "Offline Ukrainian/Russian audiobook reader for macOS (Supertonic 3 TTS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "supertonic==1.3.1",
    "onnxruntime==1.31.0",
    "numpy==2.5.4",
    "soundfile==0.14.0",
    "sounddevice==0.5.6",
    "PySide6-Essentials==6.12.0",
    "pymupdf==2.0",
    "EbookLib==0.20",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "python-docx==1.2.0",
    "num2words==0.5.14",
    "pyobjc-core==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'",
    "rapidocr==3.10.0; sys_platform != 'darwin'",
]

[project.scripts]
local-audiobook-reader = "audiobook_reader.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]
